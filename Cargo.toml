[package]
name = "storm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
directories = "6.0.0"
eject = "0.1.1"
env_logger = "0.11.8"
log = "0.4.29"
serde = { version = "1.0.228", features = [ "derive" ] }
tokio = { version = "1.48.0", features = [ "full" ] }
toml = "0.9.10"
udev = { version = "0.9.3", features = [ "mio10" ] }
which = "8.0.0"
tmdb_client = { version = "1.8.0" }
rocket = { version = "0.5.1", features = ["json"] }

